name: Release

on:
  push:
    tags:
      - "v*"
  # Allow manual dry-runs from the Actions tab (no Release gets created).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: sanfuclaw-macos-arm64
            binary: sanfuclaw
          - os: macos-13
            asset: sanfuclaw-macos-x86_64
            binary: sanfuclaw
          - os: ubuntu-22.04
            asset: sanfuclaw-linux-x86_64
            binary: sanfuclaw
          - os: windows-latest
            asset: sanfuclaw-windows-x86_64.exe
            binary: sanfuclaw.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        shell: bash
        run: pyinstaller packaging/sanfuclaw.spec

      - name: Smoke test (non-Windows)
        if: runner.os != 'Windows'
        run: ./dist/sanfuclaw version

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: .\dist\sanfuclaw.exe version

      - name: Rename artifact
        shell: bash
        run: mv "dist/${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only publish a Release on real tag pushes, not on manual dry-runs.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/**/*

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/sanfuclaw-*
          generate_release_notes: true
          fail_on_unmatched_files: true

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanfuclaw</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column;
}
header {
  padding: 16px 24px; background: #16213e; border-bottom: 1px solid #0f3460;
  display: flex; align-items: center; gap: 12px;
}
header h1 { font-size: 18px; font-weight: 600; color: #e94560; }
header .status { font-size: 12px; color: #888; margin-left: auto; }
header .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
header .dot.connected { background: #4ade80; }
header .dot.disconnected { background: #f87171; }
#messages {
  flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px;
}
.msg {
  max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.5;
  white-space: pre-wrap; word-wrap: break-word; font-size: 14px;
}
.msg.user {
  align-self: flex-end; background: #0f3460; color: #fff; border-bottom-right-radius: 4px;
}
.msg.assistant {
  align-self: flex-start; background: #222; color: #ddd; border-bottom-left-radius: 4px;
}
.msg.typing { align-self: flex-start; color: #888; font-style: italic; background: transparent; padding: 4px 16px; }
.msg.error { align-self: center; color: #f87171; background: #2a1a1a; font-size: 13px; }
#input-area {
  padding: 16px 24px; background: #16213e; border-top: 1px solid #0f3460;
  display: flex; gap: 12px;
}
#input {
  flex: 1; padding: 10px 16px; border: 1px solid #333; border-radius: 8px;
  background: #1a1a2e; color: #eee; font-size: 14px; outline: none;
  font-family: inherit;
}
#input:focus { border-color: #e94560; }
#send {
  padding: 10px 20px; background: #e94560; color: #fff; border: none;
  border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500;
}
#send:hover { background: #c73e54; }
#send:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>Sanfuclaw</h1>
  <span class="status"><span class="dot disconnected" id="status-dot"></span><span id="status-text">Connecting...</span></span>
</header>

<div id="messages"></div>

<div id="input-area">
  <input type="text" id="input" placeholder="Type a message..." autocomplete="off" />
  <button id="send">Send</button>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

let ws;
let currentAssistantMsg = null;
let sessionId = 'webchat-' + Math.random().toString(36).slice(2, 10);

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    statusDot.className = 'dot connected';
    statusText.textContent = 'Connected';
    sendBtn.disabled = false;
  };

  ws.onclose = () => {
    statusDot.className = 'dot disconnected';
    statusText.textContent = 'Disconnected';
    sendBtn.disabled = true;
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {
    statusDot.className = 'dot disconnected';
    statusText.textContent = 'Error';
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === 'typing') {
      showTyping();
    } else if (msg.type === 'stream') {
      removeTyping();
      appendStream(msg.data);
    } else if (msg.type === 'message') {
      removeTyping();
      finalizeAssistant();
      addMessage('assistant', msg.data);
    } else if (msg.type === 'error') {
      removeTyping();
      addMessage('error', msg.data);
    }

    messagesEl.scrollTop = messagesEl.scrollHeight;
  };
}

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || !ws || ws.readyState !== 1) return;

  addMessage('user', text);
  finalizeAssistant();

  ws.send(JSON.stringify({
    type: 'message',
    content: text,
    session_id: sessionId,
  }));

  inputEl.value = '';
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = content;
  messagesEl.appendChild(div);
  return div;
}

function showTyping() {
  removeTyping();
  const div = document.createElement('div');
  div.className = 'msg typing';
  div.id = 'typing-indicator';
  div.textContent = 'Thinking...';
  messagesEl.appendChild(div);
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function appendStream(text) {
  if (!currentAssistantMsg) {
    currentAssistantMsg = document.createElement('div');
    currentAssistantMsg.className = 'msg assistant';
    messagesEl.appendChild(currentAssistantMsg);
  }
  currentAssistantMsg.textContent += text;
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function finalizeAssistant() {
  currentAssistantMsg = null;
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

connect();
</script>
</body>
</html>
